[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-postman-metaheuristics"
version = "0.1.0"
description = "Metaheuristic algorithms for solving the Chinese Postman Problem"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]